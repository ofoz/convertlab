# ConvertLab — single-host deployment
#
#   cp .env.example .env      # then edit the values
#   docker compose up -d --build
#   docker compose logs -f web
#
# The web and worker containers share one data volume: uploads, converted
# output and temporary LibreOffice profiles must be visible to both.

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "8080"
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env (openssl rand -hex 32)}
  DATA_DIR: /data
  PUBLIC_DIR: /app/dist/web
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (min 8 chars)}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  FILE_TTL_HOURS: ${FILE_TTL_HOURS:-2}
  MAX_FILE_MB: ${MAX_FILE_MB:-100}
  MAX_BATCH_FILES: ${MAX_BATCH_FILES:-20}
  DAILY_JOBS: ${DAILY_JOBS:-20}
  DAILY_UPLOAD_MB: ${DAILY_UPLOAD_MB:-1024}
  DAILY_OUTPUT_MB: ${DAILY_OUTPUT_MB:-2048}
  # Built directly from POSTGRES_PASSWORD: Compose does not expand nested
  # ${...} defaults reliably. To use an external database, replace this whole
  # line with your URL in a docker-compose.override.yml file.
  DATABASE_URL: "postgresql://convertlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/convertlab"
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QUEUE_NAME: ${QUEUE_NAME:-convertlab}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
  JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-600}
  SOFFICE_PATH: soffice
  FFMPEG_PATH: ffmpeg
  FFPROBE_PATH: ffprobe
  GS_PATH: gs
  PDFTOPPM_PATH: pdftoppm
  PDFTOTEXT_PATH: pdftotext
  PDFINFO_PATH: pdfinfo
  PYTHON_TABLE_BIN: ${PYTHON_TABLE_BIN:-/opt/convertlab-python/bin/python}
  PYTHONUNBUFFERED: "1"
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: convertlab
      POSTGRES_USER: convertlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation for the audit and job tables.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - convertlab-pgdata:/var/lib/postgresql/data
    # Not published: only the app network may reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convertlab -d convertlab"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [convertlab]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - convertlab-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [convertlab]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: convertlab:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      PROCESS_ROLE: web
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - convertlab-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Uploads are streamed to disk, so memory pressure comes from concurrency,
    # not from file size. Raise these if you process many large videos at once.
    mem_limit: 2g
    cpus: "2.0"
    networks: [convertlab]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: convertlab:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      PROCESS_ROLE: worker
      # Keep in sync with the CPU allowance below; each slot may run
      # LibreOffice or FFmpeg at full tilt.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    volumes:
      - convertlab-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Conversion is CPU and memory hungry. Scale by adding CPUs here and
    # raising WORKER_CONCURRENCY, or by running more worker replicas.
    mem_limit: 4g
    cpus: "3.0"
    networks: [convertlab]

volumes:
  convertlab-data:
  convertlab-pgdata:
  convertlab-redis:

networks:
  convertlab:
    driver: bridge
